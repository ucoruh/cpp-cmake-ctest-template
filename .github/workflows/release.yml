name: Release

# Alternative to the local 10-release-windows.bat / 10-release-linux.sh: the Windows, Linux and macOS jobs of
# build-reports.yml build everything, then the publish job below builds the site with both platforms' reports, adds the
# platform-neutral assets (source.zip, site.zip, ASSETS.md, SHA256SUMS.txt) and publishes ONE GitHub Release with every
# asset - the same names the local release/ folder has. The release notes link the live site and every report page.
#
# Runs only on a version tag (v<VERSION> from project.env) or by hand: it is the slow path (roughly 15-20 minutes per
# platform) and Actions minutes are limited on GitHub Free for private repositories (2,000 min/month; macOS minutes
# count 10x). Releases work on private repositories on GitHub Free. Prefer the local 10-release-* script day to day
# (no minutes used); use this when you want a release built by a clean, reproducible environment.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-reports.yml
    with:
      macos: true

  publish:
    name: Merge, build the site and publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules, for source.zip)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Load project.env
        run: python3 tools/projectenv.py --github-env >> "$GITHUB_ENV"

      - name: Check that the tag matches VERSION in project.env
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "::error::The tag is ${{ github.ref_name }} but project.env says VERSION=$VERSION (expected tag v$VERSION). Change project.env or the tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the site tools
        run: python3 -m pip install -r requirements.txt

      - name: Download reports, badges and release assets of every platform
        uses: actions/download-artifact@v8
        with:
          path: _dl

      - name: Put everything in place
        run: |
          for p in windows linux; do
            mkdir -p "reports/$p" "assets/badges/$p"
            cp -R "_dl/reports-$p/." "reports/$p/"
            cp -R "_dl/badges-$p/." "assets/badges/$p/"
          done
          mkdir -p release
          for p in windows linux macos; do cp "_dl/assets-$p/"* release/; done
          ls -la release

      - name: Build the site and check its links (hard failure on a broken link in our own pages)
        run: python3 tools/build_site.py --strict-reports

      - name: Add the platform-neutral assets (source.zip, site.zip, ASSETS.md, SHA256SUMS.txt)
        run: python3 tools/release_assets.py neutral

      - name: Write the release notes (site link, every asset, every report page)
        run: python3 tools/release_assets.py notes --out release-notes.md

      - name: List the release assets
        run: ls -la release

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.PROJECT_NAME }} v${{ env.VERSION }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
