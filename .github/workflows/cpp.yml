name: Build and Test

# Lean CI: configure, build (Release) and run the googletest suite via CTest
# on every push and pull request. It does NOT run Doxygen/coverxygen/
# ReportGenerator/mkdocs (see 7-build-app-windows.bat / 7-build-app-linux.sh
# for the full local report+site pipeline, and .github/workflows/release.yml
# for the same thing run once per tagged release).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (Windows - CMake picks up the runner's Visual Studio)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=publish

      - name: Configure (Ubuntu - Ninja)
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=publish

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (CTest)
        working-directory: build
        run: ctest -C Release --output-on-failure --output-junit testResults.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: build/testResults.xml
          retention-days: 7
