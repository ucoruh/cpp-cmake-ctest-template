name: Build and Test

# Lean CI: build (Debug + Release) and run the googletest suite on Windows and Ubuntu with the SAME numbered
# scripts you run locally (6-build-and-test-windows.bat / 6-build-and-test-linux.sh). No reports, no site, no
# release here: the slow full pipeline lives in pages.yml (site) and release.yml (tagged releases) and is built by
# build-reports.yml, so an ordinary push finishes in a couple of minutes.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build and test (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        env:
          NO_PAUSE: '1'
        run: 6-build-and-test-windows.bat < nul

      - name: Build and test (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod +x ./*.sh scripts/*.sh
          ./6-build-and-test-linux.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: build/${{ matrix.platform }}-debug/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
