name: Deploy Pages

# On every push to main (and manually): the Windows and Linux jobs of build-reports.yml build tests, reports and API
# docs; the merge job below builds the MkDocs Material site with BOTH platforms' reports (tools/build_site.py: mkdocs
# --strict, then every report copied into site/raw/, then the link check - hard failure only for broken links inside
# our own pages) and deploys it to the gh-pages branch.
#
# PRIVATE repositories: GitHub Pages needs GitHub Pro/Team for a private repository, so the deploy step is skipped
# unless the repository variable PAGES_ON_PRIVATE is "true". The site is still built and checked, and the notice
# points to docs/guide/showcase-without-pages.en.md: the same site runs locally (7-build-all-* then 9-open-site-*)
# and every output goes into a GitHub Release (10-release-*), which works on private repositories.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-reports.yml
    with:
      macos: false

  site:
    name: Merge reports and deploy the site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load project.env
        run: python3 tools/projectenv.py --github-env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the site tools
        run: python3 -m pip install -r requirements.txt

      - name: Download every platform's reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: _dl/reports

      - name: Download every platform's badges
        uses: actions/download-artifact@v8
        with:
          pattern: badges-*
          path: _dl/badges

      - name: Put the reports and badges in place
        run: |
          for p in windows linux; do
            mkdir -p "reports/$p" "assets/badges/$p"
            cp -R "_dl/reports/reports-$p/." "reports/$p/"
            cp -R "_dl/badges/badges-$p/." "assets/badges/$p/"
          done
          ls reports/*

      - name: Build the site and check its links (hard failure on a broken link in our own pages)
        run: python3 tools/build_site.py --strict-reports

      - name: Private-repository detection
        id: privacy
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ] && [ "${{ vars.PAGES_ON_PRIVATE }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            GUIDE="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/guide/showcase-without-pages.en.md"
            echo "::notice title=GitHub Pages skipped (private repository)::This repository is private, so the site was built and checked but not deployed: GitHub Pages for a private repository needs GitHub Pro/Team (the free Student Developer Pack includes Pro). Show the same site locally (7-build-all-* then 9-open-site-*) and ship it in a release (10-release-*): $GUIDE"
            {
              echo "## GitHub Pages: skipped (private repository)"
              echo ""
              echo "The site was built and its links were checked, but not deployed: Pages for a private repository needs GitHub Pro/Team."
              echo ""
              echo "**How to show your project without Pages:** [Showing your project without GitHub Pages]($GUIDE)"
              echo ""
              echo "- locally: \`7-build-all-windows.bat\` / \`./7-build-all-linux.sh\`, then \`9-open-site-*\` (http://localhost:8000)"
              echo "- as a release: \`10-release-*\` (works on private repositories); the site is \`<project>-<version>-site.zip\`"
              echo "- with GitHub Pro (Student Developer Pack): set the repository variable \`PAGES_ON_PRIVATE=true\`, turn Pages on and re-run this workflow"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to the gh-pages branch (GitHub Pages)
        if: steps.privacy.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages

      - name: Step summary (deployed)
        if: steps.privacy.outputs.skip != 'true'
        run: |
          {
            echo "## GitHub Pages: deployed"
            echo ""
            echo "Site: $SITE_URL"
            echo ""
            echo "(The first deploy creates the gh-pages branch; Pages itself is switched on once in Settings > Pages > Source > Deploy from a branch > gh-pages / (root).)"
          } >> "$GITHUB_STEP_SUMMARY"
