# Project information
site_name: !ENV [SITE_NAME, 'calculator']
docs_dir: docs  # Where to find the English markdown files
site_dir: site  # Where to put the English HTML files
site_author: 'Asst. Prof. Dr. Uğur CORUH'
site_url: !ENV [SITE_URL, 'https://ucoruh.github.io/cpp-cmake-ctest-template/']
site_description: >-
    A complete, best-practice C/C++ course-project template: CMake + CTest + googletest, two independent
    report families (ReportGenerator and each ecosystem's native tool) for unit tests, code coverage and
    documentation coverage, Doxygen API docs, and this site tying everything together.

# Repository
repo_name: 'GitHub'
repo_url: !ENV [REPO_URL, 'https://github.com/ucoruh/cpp-cmake-ctest-template']
edit_uri: 'edit/main/docs/'

# Copyright
copyright: Copyright &copy; 2019 - 2026 CORUH ARGE VE TEKNOLOJI

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix          # name.en.md + name.tr.md next to each other (like the course sites)
      reconfigure_material: true      # language switcher in the header
      reconfigure_search: true        # search in both languages
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          build: true
          default: true               # English lives at the site root
          site_name: !ENV [SITE_NAME, 'calculator']
        - locale: tr
          name: Türkçe
          build: true                 # Turkish lives under /tr/
          site_name: !ENV [SITE_NAME, 'calculator']
          nav_translations:
            Home: Ana sayfa
            Guide: Kılavuz
            Install: Kurulum
            Use the template (private repository): Şablonu kullanma (özel depo)
            From a topic to your project: Konudan projeye
            Daily workflow: Günlük iş akışı
            Naming standard: Adlandırma standardı
            Showing a report inside the site: Siteye rapor gömme
            Showing your project without GitHub Pages: GitHub Pages olmadan projeyi gösterme
            Releases and private repositories: Sürümler ve özel depolar
            Troubleshooting: Sorun giderme
            Reference: Başvuru
            Architecture: Mimari
            Security: Güvenlik
            Developers: Geliştiriciler
            Reports: Raporlar
            Which report is which?: Hangi rapor hangisi?
            Unit test results: Birim test sonuçları
            Code coverage (ReportGenerator): Kod kapsama (ReportGenerator)
            Code coverage (OpenCppCoverage): Kod kapsama (OpenCppCoverage)
            Code coverage (lcov genhtml): Kod kapsama (lcov genhtml)
            Code coverage (gcovr): Kod kapsama (gcovr)
            Doc. coverage (ReportGenerator): Belge kapsama (ReportGenerator)
            Doc. coverage (lcov genhtml): Belge kapsama (lcov genhtml)
            API docs: API belgeleri
            Overview: Genel bakış
            Downloads: İndirmeler

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# mkdocs' own link check is switched off for links that are not .md files: the report pages point at
# standalone HTML that tools/build_site.py copies into site/raw/ AFTER the mkdocs build, so mkdocs cannot
# see those files. tools/check_site_links.py (run by tools/build_site.py, and in CI) is the real link
# checker: it walks the rendered HTML on disk and fails on any broken link inside our own pages.
validation:
  links:
    not_found: ignore

extra_css:
  - css/extra.css

extra_javascript:
  - js/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ucoruh/cpp-cmake-ctest-template
    - icon: fontawesome/solid/download
      link: https://github.com/ucoruh/cpp-cmake-ctest-template/releases/latest

nav:
    - Home: 'index.md'
    - Guide:
        - Install: 'guide/install.md'
        - Use the template (private repository): 'guide/use-template.md'
        - From a topic to your project: 'guide/topic-to-project.md'
        - Daily workflow: 'guide/daily-workflow.md'
        - Naming standard: 'guide/standard.md'
        - Showing a report inside the site: 'guide/reports-in-site.md'
        - Showing your project without GitHub Pages: 'guide/showcase-without-pages.md'
        - Releases and private repositories: 'guide/releases.md'
        - Troubleshooting: 'guide/troubleshooting.md'
        - Reference:
            - Architecture: 'architecture.md'
            - Security: 'security.md'
            - Developers: 'developers.md'
    - Reports:
        - Which report is which?: 'reports/index.md'
        - Windows:
            - Unit test results: 'reports/windows/tests-junit2html.md'
            - Code coverage (ReportGenerator): 'reports/windows/coverage-reportgenerator.md'
            - Code coverage (OpenCppCoverage): 'reports/windows/coverage-opencppcoverage.md'
            - Doc. coverage (ReportGenerator): 'reports/windows/doccoverage-reportgenerator.md'
            - Doc. coverage (lcov genhtml): 'reports/windows/doccoverage-lcov.md'
        - Linux:
            - Unit test results: 'reports/linux/tests-junit2html.md'
            - Code coverage (ReportGenerator): 'reports/linux/coverage-reportgenerator.md'
            - Code coverage (lcov genhtml): 'reports/linux/coverage-lcov.md'
            - Code coverage (gcovr): 'reports/linux/coverage-gcovr.md'
            - Doc. coverage (ReportGenerator): 'reports/linux/doccoverage-reportgenerator.md'
            - Doc. coverage (lcov genhtml): 'reports/linux/doccoverage-lcov.md'
    - API docs:
        - Overview: 'api/index.md'
        - Doxygen (Windows): 'reports/windows/api-doxygen.md'
        - Doxygen (Linux): 'reports/linux/api-doxygen.md'
    - Downloads: 'downloads.md'
